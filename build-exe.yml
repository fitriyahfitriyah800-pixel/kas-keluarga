name: Bangun aplikasi Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paketkan untuk Windows
        run: npx --yes @electron/packager desktop "Buku Kas Keluarga" --platform=win32 --arch=x64 --electron-version=33.2.1 --out dist --overwrite

      - name: Buat ZIP
        run: |
          cd dist
          zip -r -q ../BukuKasKeluarga-Windows.zip "Buku Kas Keluarga-win32-x64"

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Buku Kas Keluarga v${{ github.run_number }}
          files: BukuKasKeluarga-Windows.zip
